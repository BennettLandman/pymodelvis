# Project website. Build with `python website/build.py` (assembles website/_src from docs/ first).
site_name: pymodelvis
site_description: >-
  See what a PyTorch network sees. neural_flow draws what a specific input becomes inside a
  network, stage by stage, as figures, an interactive explorer and movies.
site_url: https://masilab.github.io/pymodelvis/
site_author: Bennett Landman
repo_url: https://github.com/MASILab/pymodelvis
repo_name: MASILab/pymodelvis
edit_uri: ""
copyright: >-
  Copyright © 2026 Bennett Landman and the MASI Lab, Vanderbilt University ·
  <a href="https://github.com/MASILab/pymodelvis/blob/main/LICENSE">BSD-3-Clause</a>

docs_dir: _src
site_dir: _site

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/site.css
extra_javascript:
  - assets/site.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MASILab/pymodelvis
    - icon: fontawesome/solid/flask
      link: https://my.vanderbilt.edu/masi/
  generator: false

nav:
  - Home: index.md
  - Get started:
      - Installation: installation.md
      - Command line: cli.md
      - Python guide: user_guide.md
  - Gallery:
      - Gallery: gallery.md
      - Examples explained: examples.md
      - Movies: movies.md
      - 3-D models: volumes_3d.md
      - Slide deck: deck/index.md
  - Real models:
      - Real models: real_models.md
      - nnU-Net and TotalSegmentator: nnunet.md
  - Reference:
      - API: api.md
      - Troubleshooting: troubleshooting.md
      - References: references.md
      - Changelog: changelog.md
  - How it works:
      - Cinematic style: cinematic.md
      - Stage selection: stage_selection.md
      - Tensor rendering: tensor_rendering.md
      - Topology: topology.md
      - Architecture: architecture.md
      - Contributing: contributing.md
  - About: about.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
  anchors: info
